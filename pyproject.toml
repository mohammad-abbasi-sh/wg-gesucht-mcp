[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wg-gesucht-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for WG-Gesucht housing listings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
wg-gesucht-mcp = "wg_gesucht_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wg_gesucht_mcp"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real https://www.wg-gesucht.de site"]
